<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mattdaemon</title>
<link rel="stylesheet" href="/static/vendor/xterm.css">
<script src="/static/vendor/xterm.js"></script>
<script src="/static/vendor/addon-fit.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg:#0b0b0c; --surface:#151517; --surface2:#101012; --border:#242427;
    --ink:#f2f2f3; --inkMute:#8a8a90; --inkDim:#5a5a60;
    --accent:#f2f2f3;                 /* mono accent = white */
    --green:#3ec97a; --red:#ff5f57; --yellow:#febc2e; --grn:#28c840;
    /* session status (matches the :3333 dashboard termStatusColor) */
    --stIdle:#22c55e;      /* green  - done, waiting for you */
    --stWorking:#eab308;   /* yellow - working / looping */
    --stAttention:#ef4444; /* red    - needs your attention */
    --stOffline:#8a8a90;   /* grey   - disconnected */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink)}

  .app{height:100vh;display:flex;flex-direction:column}

  /* ---- reconnect button (lives in the sidebar footer) ---- */
  .tb-btn{background:transparent;border:1px solid var(--border);color:var(--inkMute);
    font-size:12px;padding:5px 11px;border-radius:6px;cursor:pointer;font-family:'JetBrains Mono',monospace}
  .tb-btn:hover{background:#202023;color:var(--ink)}
  .sb-reconnect{width:100%}

  /* ---- right-click context menu (session rows) ---- */
  .ctx{position:fixed;z-index:50;min-width:158px;background:#161617;border:1px solid var(--border);
    border-radius:8px;padding:4px;box-shadow:0 10px 30px rgba(0,0,0,.55);display:none;
    font-family:'JetBrains Mono',monospace}
  .ctx.open{display:block}
  .ctx button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;
    border:0;color:var(--inkMute);font-size:12px;padding:8px 10px;border-radius:5px;cursor:pointer;font-family:inherit}
  .ctx button:hover{background:#202023;color:var(--ink)}
  .ctx button.danger:hover{background:#2a1618;color:var(--red)}
  .ctx .sep{height:1px;background:var(--border);margin:4px 2px}
  .ctx .k{width:14px;text-align:center;opacity:.8}

  /* ---- confirm modal (custom - WKWebView suppresses window.confirm) ---- */
  .modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.55);
    display:none;align-items:center;justify-content:center}
  .modal-backdrop.open{display:flex}
  .modal{background:#161617;border:1px solid var(--border);border-radius:12px;padding:20px 20px 16px;
    width:340px;max-width:90vw;box-shadow:0 24px 70px rgba(0,0,0,.6);font-family:'JetBrains Mono',monospace}
  .modal-title{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:9px}
  .modal-msg{font-size:12px;color:var(--inkMute);line-height:1.55;margin-bottom:18px}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end}
  .modal-actions button{font-family:inherit;font-size:12px;padding:7px 14px;border-radius:6px;
    cursor:pointer;border:1px solid var(--border)}
  .modal .btn-cancel{background:transparent;color:var(--inkMute)}
  .modal .btn-cancel:hover{background:#202023;color:var(--ink)}
  .modal .btn-danger{background:var(--stAttention);border-color:var(--stAttention);color:#fff}
  .modal .btn-danger:hover{filter:brightness(1.12)}

  /* ---- body: sidebar + terminal ---- */
  .body{flex:1;display:flex;min-height:0}

  .sidebar{width:236px;flex:none;background:var(--surface2);border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:13px 11px;gap:10px;min-height:0}
  .side-top{display:flex;gap:7px}
  .side-top button{flex:1;padding:8px;font-size:12px;border-radius:6px;background:transparent;
    border:1px solid var(--border);color:var(--inkMute);cursor:pointer;font-family:'JetBrains Mono',monospace;white-space:nowrap}
  .side-top button.bell{flex:none;width:38px}
  .side-top button:hover{border-color:#3a3a3f;color:var(--ink)}
  .btn-new{padding:10px 12px;font-size:13px;font-weight:600;border-radius:6px;cursor:pointer;
    color:#0b0b0c;background:#f2f2f3;border:1px solid #f2f2f3;font-family:'JetBrains Mono',monospace}
  .btn-new:hover{background:#fff}
  .btn-new:disabled{opacity:.5;cursor:default}
  .side-label{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
    color:#54545a;padding:4px 6px 0;font-family:'JetBrains Mono',monospace}
  .sess-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
  .sess{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:6px;cursor:pointer;
    border:1px solid transparent;color:var(--inkMute);font-size:13px;transition:.1s;font-family:'JetBrains Mono',monospace}
  .sess:hover{background:#17171a}
  .sess.active{background:#1e1e21;border-color:#33333a;color:var(--ink)}
  .sess .sdot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--stIdle)}
  .sess .sname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
  .sess .sname[contenteditable="true"]{outline:1px solid #45454b;border-radius:3px;padding:0 3px;cursor:text;white-space:nowrap;overflow:hidden}
  .sess .stag{font-size:10px;color:var(--inkDim);background:#1c1c1f;padding:2px 6px;border-radius:4px}
  .sess.active .stag{color:var(--inkMute);background:#28282c}
  .sdot.s-idle{background:var(--stIdle);box-shadow:0 0 6px rgba(34,197,94,.4)}
  .sdot.s-offline{background:var(--stOffline)}
  .sdot.s-working,.sdot.s-looping{background:var(--stWorking);
    box-shadow:0 0 6px rgba(234,179,8,.5);animation:pulse 1.4s ease-in-out infinite}
  .sdot.s-attention{background:var(--stAttention);
    box-shadow:0 0 8px rgba(239,68,68,.6);animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .sess-count{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--inkDim);
    text-align:center;padding-top:5px;border-top:1px solid var(--border)}

  /* ---- terminal ---- */
  .term-wrap{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
  .term-head{height:36px;flex:none;display:flex;align-items:center;gap:10px;padding:0 15px;
    border-bottom:1px solid var(--border);background:#0d0d0e}
  .term-head .chip{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;padding:3px 9px;
    border-radius:5px;border:1px solid var(--border);color:var(--inkDim)}
  .term-head .chip.live{color:var(--ink);border-color:#3a3a3f}
  /* xterm host - replaces the mock's fake .term div */
  .term{flex:1;min-height:0;position:relative;padding:8px 6px 8px 12px;background:var(--bg)}
  .term .xterm{height:100%}
  .term .xterm-viewport::-webkit-scrollbar,.sess-list::-webkit-scrollbar{width:10px}
  .term .xterm-viewport::-webkit-scrollbar-thumb,.sess-list::-webkit-scrollbar-thumb{background:#26262a;border-radius:6px}
  /* an empty state / connecting notice overlaid on the terminal host */
  .term .placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--inkDim);pointer-events:none}
</style>
</head>
<body>
<div class="app">
  <div class="body">
    <!-- sidebar -->
    <aside class="sidebar">
      <button class="btn-new" id="btnNew">+ New session</button>

      <div class="side-label">Sessions</div>
      <div class="sess-list" id="sessList"></div>

      <div class="sess-count" id="sessCount">0 sessions</div>
      <button class="tb-btn sb-reconnect" id="btnReload">&#8635; Reconnect</button>
    </aside>

    <!-- terminal -->
    <div class="term-wrap">
      <div class="term-head">
        <span class="chip" id="termChip">&#9679; idle</span>
      </div>
      <div class="term" id="term">
        <div class="placeholder" id="termPlaceholder">No session &mdash; create one to begin.</div>
      </div>
    </div>
  </div>
</div>

<!-- right-click menu for session rows -->
<div class="ctx" id="ctxMenu">
  <button id="ctxRename"><span class="k">&#9998;</span> Rename</button>
  <div class="sep"></div>
  <button id="ctxClose" class="danger"><span class="k">&#10005;</span> Close session</button>
</div>

<!-- confirm dialog -->
<div class="modal-backdrop" id="confirmBackdrop">
  <div class="modal">
    <div class="modal-title" id="confirmTitle">Close session?</div>
    <div class="modal-msg" id="confirmMsg"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="confirmCancel">Cancel</button>
      <button class="btn-danger" id="confirmOk">Close session</button>
    </div>
  </div>
</div>

<script>
  // ─────────────────────────────────────────────────────────────────────────
  // ML Suite Terminal - real xterm.js UI wired to the tmux-backed web-terminal
  // API (see clients/_self/Work/dev/mac-terminal/terminal_manager.py and the
  // working client at shared/terminal-popup.html). The mock's demo SESSIONS
  // object is gone; every pane here is a live shell.
  // ─────────────────────────────────────────────────────────────────────────

  const TERM_THEME = {
    background: '#0b0b0c',
    foreground: '#f2f2f3',
    cursor: '#f2f2f3',
    selectionBackground: 'rgba(242,242,243,0.20)',
  };
  const TERM_FONT = "'JetBrains Mono', 'Fira Code', monospace";

  const termHost   = document.getElementById('term');
  const placeholder= document.getElementById('termPlaceholder');
  const sessListEl = document.getElementById('sessList');
  const sessCountEl= document.getElementById('sessCount');
  // chrome removed: no in-page titlebar, no session-name label in the term head -
  // the native window title bar + sidebar carry the identity; the head keeps only
  // the status chip.
  const chipEl     = document.getElementById('termChip');
  const btnNew     = document.getElementById('btnNew');

  // One live xterm "pane" per session id, kept alive so scrollback and the
  // stream are not destroyed when you switch away and back.
  //   panes[sid] = { term, fit, container, abort, connected, name, exited }
  const panes = {};
  let sessions = [];      // last /sessions listing
  let states = {};        // last /states  (sid -> working|attention|idle|looping|offline)
  let activeSid = null;

  // ── pane lifecycle ──────────────────────────────────────────────────────
  function makePane(sid, name) {
    const container = document.createElement('div');
    container.style.width = '100%';
    container.style.height = '100%';
    container.style.display = 'none';
    termHost.appendChild(container);

    const term = new Terminal({
      cursorBlink: true,
      fontSize: 13.5,
      fontFamily: TERM_FONT,
      theme: TERM_THEME,
      allowProposedApi: true,
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(container);

    const pane = { term, fit, container, abort: null, connected: false, name, exited: false };
    panes[sid] = pane;

    // debounced input (~16ms) like the reference client
    let inputBuffer = '', flushTimer = null, resizeTimer = null;
    term.onData(data => {
      inputBuffer += data;
      if (!flushTimer) {
        flushTimer = setTimeout(() => {
          const buf = inputBuffer; inputBuffer = ''; flushTimer = null;
          fetch('/api/terminal/input', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sid, data: buf })
          }).catch(() => {});
        }, 16);
      }
    });
    // debounced resize (~200ms) like the reference client
    term.onResize(({ cols, rows }) => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        fetch('/api/terminal/resize', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sid, cols, rows })
        }).catch(() => {});
      }, 200);
    });

    connectPane(sid);
    return pane;
  }

  function connectPane(sid) {
    const pane = panes[sid];
    if (!pane || pane.connected) return;
    pane.exited = false;
    pane.abort = new AbortController();
    pane.connected = true;
    fetch(`/api/terminal/stream?sid=${encodeURIComponent(sid)}`, { signal: pane.abort.signal })
      .then(res => {
        if (!res.ok) throw new Error('stream failed');
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';
        function pump() {
          reader.read().then(({ done, value }) => {
            if (done) { pane.connected = false; return; }
            buf += decoder.decode(value, { stream: true });
            const lines = buf.split('\n');
            buf = lines.pop();
            for (const line of lines) {
              if (!line.startsWith('data: ')) continue;
              let evt;
              try { evt = JSON.parse(line.slice(6)); } catch { continue; }
              if (evt.type === 'output' || evt.type === 'replay') {
                const bytes = Uint8Array.from(atob(evt.data), c => c.charCodeAt(0));
                pane.term.write(bytes);
              } else if (evt.type === 'exit') {
                pane.term.write('\r\n\x1b[33m[Session ended]\x1b[0m\r\n');
                pane.exited = true;
                pane.connected = false;
                if (sid === activeSid) renderHead();
                return;
              }
              // ping / detached / desync: keep pumping; the server re-attaches
              // the underlying view for us.
            }
            pump();
          }).catch(() => { pane.connected = false; });
        }
        pump();
        if (sid === activeSid) { try { pane.fit.fit(); } catch {} }
      })
      .catch(() => { pane.connected = false; });
  }

  function destroyPane(sid) {
    const pane = panes[sid];
    if (!pane) return;
    try { pane.abort && pane.abort.abort(); } catch {}
    try { pane.term.dispose(); } catch {}
    if (pane.container.parentNode) pane.container.parentNode.removeChild(pane.container);
    delete panes[sid];
  }

  // ── switching the active session ─────────────────────────────────────────
  function switchTo(sid) {
    if (!sid) return;
    activeSid = sid;
    let pane = panes[sid];
    if (!pane) {
      const s = sessions.find(x => x.id === sid);
      pane = makePane(sid, s ? s.name : sid);
    } else if (!pane.connected && !pane.exited) {
      // A session whose stream had dropped (server restart etc.) reconnects on
      // focus; tmux redraws the current screen.
      connectPane(sid);
    }
    placeholder.style.display = 'none';
    for (const id in panes) panes[id].container.style.display = (id === sid) ? 'block' : 'none';
    // fit after the container becomes visible (0-size fit is a no-op)
    requestAnimationFrame(() => {
      try { pane.fit.fit(); } catch {}
      pane.term.focus();
    });
    renderSessions();
    renderHead();
  }

  // ── header + status chip ─────────────────────────────────────────────────
  function renderHead() {
    const s = sessions.find(x => x.id === activeSid);
    const name = s ? s.name : (panes[activeSid] ? panes[activeSid].name : '-');
    document.title = name + ' - Mattdaemon';
    const pane = panes[activeSid];
    if (pane && pane.exited) {
      chipEl.className = 'chip'; chipEl.innerHTML = '&#9679; ended'; return;
    }
    const st = states[activeSid] || 'idle';
    const label = { working: 'working', attention: 'needs you', looping: 'looping',
                    idle: 'ready', offline: 'offline' }[st] || st;
    const live = (st === 'working' || st === 'attention' || st === 'looping');
    chipEl.className = live ? 'chip live' : 'chip';
    chipEl.innerHTML = '<span style="color:' + stateColor(st) + '">&#9679;</span> ' + label;
  }

  // ── sidebar ──────────────────────────────────────────────────────────────
  // Status classes/colours mirror the :3333 dashboard: green = done/waiting for
  // you, yellow = working or looping, red = needs you, grey = offline.
  function dotClass(sid) {
    return 's-' + (states[sid] || 'idle');
  }
  function stateColor(st) {
    if (st === 'working' || st === 'looping') return 'var(--stWorking)';
    if (st === 'attention') return 'var(--stAttention)';
    if (st === 'offline') return 'var(--stOffline)';
    return 'var(--stIdle)';
  }

  let renaming = false;   // true while an inline rename is open - pauses re-render
  function renderSessions() {
    if (renaming) return;   // never tear down the list mid-edit (would drop focus)
    sessListEl.innerHTML = '';
    for (const s of sessions) {
      const row = document.createElement('div');
      row.className = 'sess' + (s.id === activeSid ? ' active' : '');
      row.dataset.s = s.id;

      const dot = document.createElement('span');
      dot.className = 'sdot ' + dotClass(s.id);

      const nm = document.createElement('span');
      nm.className = 'sname';
      nm.textContent = s.name;

      const tag = document.createElement('span');
      tag.className = 'stag';
      tag.textContent = s.id.slice(0, 4);

      row.appendChild(dot); row.appendChild(nm); row.appendChild(tag);

      row.addEventListener('click', () => {
        if (nm.getAttribute('contenteditable') === 'true') return;
        switchTo(s.id);
      });
      // double-click the name to rename via POST /api/terminal/rename
      nm.addEventListener('dblclick', ev => {
        ev.stopPropagation();
        startRename(nm, s);
      });
      // right-click anywhere on the row for the rename / close menu
      row.addEventListener('contextmenu', ev => {
        ev.preventDefault();
        openCtx(ev.clientX, ev.clientY, nm, s);
      });

      sessListEl.appendChild(row);
    }
    const running = sessions.filter(s => {
      const st = states[s.id];
      return st === 'working' || st === 'attention' || st === 'looping';
    }).length;
    sessCountEl.textContent = sessions.length + ' session' + (sessions.length === 1 ? '' : 's')
      + (running ? ' · ' + running + ' running' : '');
  }

  function startRename(nm, s) {
    renaming = true;
    nm.setAttribute('contenteditable', 'true');
    nm.focus();
    const range = document.createRange();
    range.selectNodeContents(nm);
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(range);

    let done = false;
    const finish = commit => {
      if (done) return; done = true;
      renaming = false;
      nm.removeAttribute('contenteditable');
      const newName = nm.textContent.trim();
      if (commit && newName && newName !== s.name) {
        fetch('/api/terminal/rename', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sid: s.id, name: newName })
        }).then(() => refreshSessions()).catch(() => {});
        s.name = newName;
        if (s.id === activeSid) renderHead();
      } else {
        nm.textContent = s.name;
      }
    };
    nm.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') { ev.preventDefault(); finish(true); }
      else if (ev.key === 'Escape') { ev.preventDefault(); finish(false); }
    });
    nm.addEventListener('blur', () => finish(true), { once: true });
  }

  // ── right-click context menu ─────────────────────────────────────────────
  const ctxMenu = document.getElementById('ctxMenu');
  let ctxTarget = null;   // { nm, s } of the row the menu was opened on

  function openCtx(x, y, nm, s) {
    ctxTarget = { nm, s };
    ctxMenu.style.left = x + 'px';
    ctxMenu.style.top = y + 'px';
    ctxMenu.classList.add('open');
    // nudge back inside the viewport if it would overflow the edges
    const r = ctxMenu.getBoundingClientRect();
    if (r.right > window.innerWidth)  ctxMenu.style.left = Math.max(4, x - r.width) + 'px';
    if (r.bottom > window.innerHeight) ctxMenu.style.top = Math.max(4, y - r.height) + 'px';
  }
  function closeCtx() { ctxMenu.classList.remove('open'); ctxTarget = null; }

  document.getElementById('ctxRename').addEventListener('click', () => {
    const t = ctxTarget; closeCtx();
    if (!t) return;
    // Defer past this click: closeCtx() hides the menu and the click's own focus
    // fixups would otherwise blur the edit field the instant it opens (the
    // "rename drops out" bug). Re-resolve the row in case the list re-rendered.
    setTimeout(() => {
      const row = sessListEl.querySelector('.sess[data-s="' + t.s.id + '"]');
      const nm = row ? row.querySelector('.sname') : t.nm;
      if (nm) startRename(nm, t.s);
    }, 0);
  });
  document.getElementById('ctxClose').addEventListener('click', () => {
    const t = ctxTarget; closeCtx();
    if (!t) return;
    // Confirm first - a misclick here would otherwise kill the session and every
    // process in it. Custom modal because WKWebView suppresses window.confirm().
    askConfirm('Close "' + t.s.name + '"?',
      'This ends the session and any processes running in it. This cannot be undone.',
      'Close session',
      () => {
        fetch('/api/terminal/stop', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sid: t.s.id })
        }).then(() => refreshSessions()).catch(() => {});
      });
  });
  // dismiss on any click elsewhere, Escape, scroll or resize
  window.addEventListener('click', closeCtx);
  window.addEventListener('resize', closeCtx);
  window.addEventListener('blur', closeCtx);
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeCtx(); });

  // ── confirm dialog (custom; WKWebView suppresses window.confirm) ──────────
  const confirmBackdrop = document.getElementById('confirmBackdrop');
  const confirmTitleEl  = document.getElementById('confirmTitle');
  const confirmMsgEl    = document.getElementById('confirmMsg');
  const confirmOkEl     = document.getElementById('confirmOk');
  const confirmCancelEl = document.getElementById('confirmCancel');
  let confirmOnOk = null;

  function askConfirm(title, message, okLabel, onOk) {
    confirmTitleEl.textContent = title;
    confirmMsgEl.textContent = message;
    confirmOkEl.textContent = okLabel || 'Confirm';
    confirmOnOk = onOk;
    confirmBackdrop.classList.add('open');
    confirmOkEl.focus();
  }
  function closeConfirm() { confirmBackdrop.classList.remove('open'); confirmOnOk = null; }

  confirmOkEl.addEventListener('click', () => { const f = confirmOnOk; closeConfirm(); if (f) f(); });
  confirmCancelEl.addEventListener('click', closeConfirm);
  confirmBackdrop.addEventListener('click', ev => { if (ev.target === confirmBackdrop) closeConfirm(); });
  document.addEventListener('keydown', ev => {
    if (!confirmBackdrop.classList.contains('open')) return;
    if (ev.key === 'Escape') { ev.preventDefault(); closeConfirm(); }
    else if (ev.key === 'Enter') { ev.preventDefault(); const f = confirmOnOk; closeConfirm(); if (f) f(); }
  });

  // ── polling: sessions + states ───────────────────────────────────────────
  async function refreshSessions() {
    try {
      const r = await fetch('/api/terminal/sessions');
      const j = await r.json();
      if (!j.ok) return;
      sessions = j.sessions || [];
    } catch { return; }
    // drop panes for sessions that no longer exist
    const live = new Set(sessions.map(s => s.id));
    for (const id in panes) if (!live.has(id)) destroyPane(id);
    // auto-select something if nothing is active
    if (!activeSid || !live.has(activeSid)) {
      if (sessions.length) switchTo(sessions[0].id);
      else { activeSid = null; placeholder.style.display = 'flex'; renderHead(); }
    }
    renderSessions();
    if (activeSid) renderHead();
  }

  async function refreshStates() {
    try {
      const r = await fetch('/api/terminal/states');
      const j = await r.json();
      if (j.ok) states = j.states || {};
    } catch { return; }
    renderSessions();
    if (activeSid) renderHead();
  }

  // ── new session ──────────────────────────────────────────────────────────
  async function newSession() {
    btnNew.disabled = true;
    try {
      const r = await fetch('/api/terminal/start', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({})
      });
      const j = await r.json();
      if (j.ok && j.session) {
        await refreshSessions();
        switchTo(j.session.id);
      }
    } catch {} finally { btnNew.disabled = false; }
  }
  btnNew.addEventListener('click', newSession);

  document.getElementById('btnReload').addEventListener('click', () => {
    const pane = panes[activeSid];
    if (pane && !pane.connected) { pane.exited = false; connectPane(activeSid); }
    if (pane) { try { pane.fit.fit(); } catch {} }
  });

  // keep the active pane fitted to the window
  new ResizeObserver(() => {
    const pane = panes[activeSid];
    if (pane) { try { pane.fit.fit(); } catch {} }
  }).observe(termHost);

  // ── boot ─────────────────────────────────────────────────────────────────
  (async function init() {
    await refreshStates();
    await refreshSessions();
    setInterval(refreshStates, 3000);
    setInterval(refreshSessions, 8000);
  })();
</script>
</body>
</html>
